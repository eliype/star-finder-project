name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a Python on the BUILD machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner image already ships the Android SDK; just accept its licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: PolarisFinder
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: PolarisFinder
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: PolarisFinder-debug-apk
          path: PolarisFinder/app/build/outputs/apk/debug/*.apk
